version: "3.8"

services:
  app:
    build: .
    container_name: ums_app
    #network_mode: "host"
    volumes:
      - .:/var/www/html
    ports:
      - "9000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: ums_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: securepassword
      MYSQL_DATABASE: homestead
      MYSQL_USER: root
      MYSQL_PASSWORD: securepassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: