version: "3.8"

services:
  app:
    build: .
    container_name: ums_app
    #network_mode: "host"
    volumes:
      - .:/var/www/html
    ports:
      - "9000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: ums_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: securePassword
      MYSQL_DATABASE: homestead
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    container_name: ums_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data: